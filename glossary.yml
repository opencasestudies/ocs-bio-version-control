.gitignore: |
  File that tells Git what files to avoid tracking
branch: |
  A history of commits in a Git-tracked repository (there can be multiple parallel branches in a repository) 
command line: |
  A window that lets a user interact with a computer through typing commands
commit: |
  A snapshot of all files in a repository at a moment in time 
fork: |
  A copy of a remote GitHub repository, owned on a personal GitHub account
Git: |
  A popular version control tool that works to track files on a local computer 
Git LFS: |
  Git large file storage, an option to version control large files that are too large to track using Git and GitHub
GitHub: |
  A website for hosting folders that are tracked with GitHub
GitHub Desktop: |
  A graphical user interface for interacting with Git on a local computer 
license: |
  A legal document that states who can use your code and for what purposes 
local: |
  The Git-tracked repository on your computer
longitudinal: |
  Over time (a longitudinal study follows a group of participants over time)
merge: |
  Integrating changes from one branch to another branch 
merge conflict: |
  When Git cannot automatically reconcile differences between branches it is attempting to combine, typically because the same part of a file (or closely related parts) were edited in incompatible ways, or because one branch modified something the other removed
meta-analysis: | 
  An analysis of data from a collection of studies targeting a common research question
meta-analyses: | 
  Analyses of data from a collection of studies targeting a common research question
microbiome: |
  A collection of microorganisms that live in a shared environment
pull request: |
  A request to integrate a collection of commits from one branch (or from a fork) into another branch (or another repository)
push: |
  Sending commits from the local version of a repository to the remote version of the repository on GitHub
quarto: |
  A type of document that combines code with the output of the code and text 
README: |
  A document that describes what files are in a folder, as well as other relevant information 
remote: |
  The online version of the repository tracked on GitHub
repository: |
  A folder in Git that contains all of the files to be tracked for a project
repositories: |
  Folders in Git that contains all of the files to be tracked for a project
repo: |
  A shortened version of "repository", a folder in Git that contains all of hte files to be tracked for a project
reproducible: |
  A project in which a new researcher can re-run an experiment or analysis with the same data and code and generate the same results
reproducibility: |
  The ability for someone else the run the same analysis on the same data and get the same results
version control: |
  A tool that records changes to a project over time
